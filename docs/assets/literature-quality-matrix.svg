<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">Literature quality gate matrix</title>
  <desc id="desc">A matrix showing how literature search hits are checked by recency, venue decision, source quality, and relevance before becoming accepted evidence.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="1200" height="640" fill="#fbfdff"/>
  <text x="54" y="58" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700" fill="#0f172a">Literature Quality Gate</text>
  <text x="54" y="88" font-family="Inter, Arial, sans-serif" font-size="16" fill="#475569">An agent can search successfully and still return sources that should not support a claim.</text>

  <rect x="50" y="125" width="1090" height="70" rx="8" fill="#0f172a"/>
  <text x="78" y="167" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#ffffff">Candidate search hit</text>
  <text x="342" y="167" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#ffffff">Recency</text>
  <text x="510" y="167" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#ffffff">Venue decision</text>
  <text x="725" y="167" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#ffffff">Quality</text>
  <text x="875" y="167" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#ffffff">Relevance</text>
  <text x="1040" y="167" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#ffffff">Action</text>

  <rect x="50" y="215" width="1090" height="92" rx="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="2" filter="url(#shadow)"/>
  <text x="78" y="251" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#064e3b">P009 Nature 2026</text>
  <text x="78" y="278" font-family="Inter, Arial, sans-serif" font-size="13" fill="#334155">scientific literature synthesis</text>
  <rect x="328" y="238" width="110" height="32" rx="8" fill="#bbf7d0"/>
  <text x="353" y="259" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#14532d">current</text>
  <rect x="510" y="238" width="118" height="32" rx="8" fill="#bbf7d0"/>
  <text x="536" y="259" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#14532d">accepted</text>
  <rect x="704" y="238" width="102" height="32" rx="8" fill="#bbf7d0"/>
  <text x="729" y="259" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#14532d">strong</text>
  <rect x="874" y="238" width="94" height="32" rx="8" fill="#bbf7d0"/>
  <text x="903" y="259" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#14532d">direct</text>
  <text x="1030" y="259" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#15803d">accept</text>

  <rect x="50" y="327" width="1090" height="92" rx="8" fill="#fefce8" stroke="#ca8a04" stroke-width="2" filter="url(#shadow)"/>
  <text x="78" y="363" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#713f12">P003 RAG 2020</text>
  <text x="78" y="390" font-family="Inter, Arial, sans-serif" font-size="13" fill="#334155">foundational retrieval background</text>
  <rect x="328" y="350" width="130" height="32" rx="8" fill="#fef08a"/>
  <text x="350" y="371" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#713f12">foundational</text>
  <rect x="510" y="350" width="118" height="32" rx="8" fill="#bbf7d0"/>
  <text x="536" y="371" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#14532d">accepted</text>
  <rect x="688" y="350" width="152" height="32" rx="8" fill="#fde68a"/>
  <text x="707" y="371" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#713f12">usable with limits</text>
  <rect x="862" y="350" width="126" height="32" rx="8" fill="#fde68a"/>
  <text x="887" y="371" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#713f12">background</text>
  <text x="1000" y="371" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#a16207">use as context</text>

  <rect x="50" y="439" width="1090" height="92" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2" filter="url(#shadow)"/>
  <text x="78" y="475" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#7f1d1d">S001 search log 2017</text>
  <text x="78" y="502" font-family="Inter, Arial, sans-serif" font-size="13" fill="#334155">old, unknown, weakly related hit</text>
  <rect x="328" y="462" width="92" height="32" rx="8" fill="#fecaca"/>
  <text x="356" y="483" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#7f1d1d">stale</text>
  <rect x="510" y="462" width="112" height="32" rx="8" fill="#fecaca"/>
  <text x="536" y="483" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#7f1d1d">unknown</text>
  <rect x="704" y="462" width="116" height="32" rx="8" fill="#fecaca"/>
  <text x="728" y="483" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#7f1d1d">unusable</text>
  <rect x="866" y="462" width="110" height="32" rx="8" fill="#fecaca"/>
  <text x="890" y="483" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#7f1d1d">off topic</text>
  <text x="1026" y="483" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#dc2626">reject</text>

  <rect x="50" y="562" width="1090" height="42" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="78" y="588" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#0c4a6e">Rule: sources can stay in the search log even when they are blocked from accepted evidence.</text>
</svg>
