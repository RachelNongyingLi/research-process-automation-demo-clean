<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Multi-agent relationship topology</title>
  <desc id="desc">A topology diagram showing an orchestrator agent routing work to skill, draft, literature, evidence, style, critic, delivery, and human approval roles.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#334155"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="1200" height="680" fill="#f8fafc"/>
  <text x="54" y="58" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700" fill="#0f172a">Multi-Agent Relationship Topology</text>
  <text x="54" y="88" font-family="Inter, Arial, sans-serif" font-size="16" fill="#475569">Agents are connected by typed handoffs, not loose conversation turns.</text>

  <rect x="486" y="126" width="228" height="92" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2" filter="url(#shadow)"/>
  <text x="530" y="164" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#1e3a8a">orchestrator_agent</text>
  <text x="528" y="191" font-family="Inter, Arial, sans-serif" font-size="13" fill="#334155">state owner + router</text>

  <rect x="88" y="300" width="170" height="80" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="2" filter="url(#shadow)"/>
  <text x="124" y="333" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#4c1d95">skill_agent</text>
  <text x="120" y="358" font-family="Inter, Arial, sans-serif" font-size="13" fill="#334155">checklist</text>

  <rect x="310" y="300" width="170" height="80" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="2" filter="url(#shadow)"/>
  <text x="346" y="333" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#4c1d95">draft_agent</text>
  <text x="344" y="358" font-family="Inter, Arial, sans-serif" font-size="13" fill="#334155">first artifact</text>

  <rect x="532" y="300" width="170" height="80" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2" filter="url(#shadow)"/>
  <text x="563" y="333" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#92400e">literature_agent</text>
  <text x="560" y="358" font-family="Inter, Arial, sans-serif" font-size="13" fill="#334155">source candidates</text>

  <rect x="754" y="300" width="170" height="80" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2" filter="url(#shadow)"/>
  <text x="785" y="333" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#14532d">evidence_agent</text>
  <text x="786" y="358" font-family="Inter, Arial, sans-serif" font-size="13" fill="#334155">source decision</text>

  <rect x="976" y="300" width="170" height="80" rx="8" fill="#fae8ff" stroke="#c026d3" stroke-width="2" filter="url(#shadow)"/>
  <text x="1010" y="333" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#86198f">style_reviewer</text>
  <text x="1014" y="358" font-family="Inter, Arial, sans-serif" font-size="13" fill="#334155">phrasing risk</text>

  <rect x="310" y="500" width="170" height="80" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2" filter="url(#shadow)"/>
  <text x="346" y="533" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#7f1d1d">critic_agent</text>
  <text x="337" y="558" font-family="Inter, Arial, sans-serif" font-size="13" fill="#334155">independent review</text>

  <rect x="532" y="500" width="170" height="80" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="2" filter="url(#shadow)"/>
  <text x="560" y="533" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#134e4a">delivery_agent</text>
  <text x="560" y="558" font-family="Inter, Arial, sans-serif" font-size="13" fill="#334155">ship package</text>

  <rect x="754" y="500" width="170" height="80" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="2" filter="url(#shadow)"/>
  <text x="790" y="533" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#713f12">human_owner</text>
  <text x="798" y="558" font-family="Inter, Arial, sans-serif" font-size="13" fill="#334155">final approval</text>

  <line x1="486" y1="172" x2="258" y2="300" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="258" y1="340" x2="310" y2="340" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="480" y1="340" x2="532" y2="340" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="702" y1="340" x2="754" y2="340" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M480 352 C606 440 780 440 838 380" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M480 354 C430 416 394 444 394 500" fill="none" stroke="#dc2626" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M924 340 C975 310 1000 275 714 190" fill="none" stroke="#16a34a" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M1146 340 C1146 216 825 170 714 172" fill="none" stroke="#c026d3" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M480 540 C530 540 532 540 532 540" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="702" y1="540" x2="754" y2="540" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M617 500 C617 410 650 290 714 202" fill="none" stroke="#0d9488" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#arrow)"/>

  <rect x="64" y="620" width="1072" height="38" rx="8" fill="#111827"/>
  <text x="88" y="644" font-family="Inter, Arial, sans-serif" font-size="14" fill="#e5e7eb">Control rule: workers and reviewers can recommend; the orchestrator records state; only the human owner approves final delivery.</text>
</svg>
